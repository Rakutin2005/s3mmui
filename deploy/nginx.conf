# nginx configuration for s3mm management UI (static SPA + API reverse proxy)
#
# Deployment:
#   1. Copy the contents of ./dist to /var/www/s3mmui (or adjust `root` below).
#   2. Put this file into /etc/nginx/conf.d/s3mmui.conf (or include it).
#   3. Adjust `server_name` and the backend upstream address.
#   4. Run: nginx -t && systemctl reload nginx
#
# The UI is built with API_BASE=/api, so all backend requests go to /api/*.
# nginx strips the /api prefix before forwarding to the s3mm backend.

upstream s3mm_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/s3mmui;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Do not cache the SPA entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Long-lived cache for hashed static assets
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Other static files (icons, favicon, etc.)
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # API reverse proxy (prefix /api is stripped)
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://s3mm_backend/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Support large object uploads through the browser
        client_max_body_size 100m;
    }

    # SPA fallback: any unknown route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
